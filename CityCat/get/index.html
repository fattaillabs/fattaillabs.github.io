<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get CityCat</title>
<!-- 한 링크로 두 스토어: 프로필 링크·QR 용. 아이폰 → App Store, 안드로이드 → Google Play, 그 밖은 랜딩 -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://fattaillabs.com/CityCat/">
<meta property="og:title" content="CityCat — Cross the World's Streets">
<meta property="og:description" content="A pixel cat. Streets from around the world. Every car tracked by AI. Free on iPhone and Android.">
<meta property="og:image" content="https://fattaillabs.com/CityCat/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<script>
  (function () {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var dest = ios ? 'https://apps.apple.com/app/id6792511960'
             : /Android/.test(ua) ? 'https://play.google.com/store/apps/details?id=com.fattail.citycat'
             : '/CityCat/';
    location.replace(dest);
  })();
</script>
<style>
  body { background: #111318; color: #e8e8e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         text-align: center; padding: 64px 16px; }
  a { display: block; max-width: 320px; margin: 12px auto; padding: 14px; border: 2px solid #FFD93B; border-radius: 12px;
      color: #FFD93B; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <p>Opening the store…</p>
  <a href="https://apps.apple.com/app/id6792511960">App Store</a>
  <a href="https://play.google.com/store/apps/details?id=com.fattail.citycat">Google Play</a>
</body>
</html>
